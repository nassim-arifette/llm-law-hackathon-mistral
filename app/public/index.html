<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counsel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0d'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-top">
      <a class="brand" href="#/assistant"><span class="mark">C</span>Counsel</a>
      <button class="icon-btn mobile-only" data-act="close-side" aria-label="Close the menu"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="nav-item" data-act="new-chat"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span data-i18n="newChat">New chat</span></button>
    <a class="nav-item" href="#/assistant" data-view="assistant"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span data-i18n="assistant">Assistant</span></a>
    <a class="nav-item" href="#/agenda" data-view="agenda"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span data-i18n="agenda">Agenda</span><span class="badge" id="agendaBadge"></span></a>
    <a class="nav-item" href="#/tracabilite" data-view="tracabilite"><svg class="i" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="trace">Traceability</span><span class="badge" id="ledgerBadge"></span></a>

    <div class="side-label" data-i18n="caseLabel">Case</div>
    <div class="case-card" id="caseCard"></div>

    <div class="side-label" data-i18n="chats">Chats</div>
    <div class="history" id="history"></div>

    <div class="side-foot">
      <div class="menu" id="menu" hidden></div>
      <button class="me" id="me" data-act="menu" aria-haspopup="true"></button>
    </div>
  </aside>
  <div class="scrim" data-act="close-side"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn mobile-only" data-act="open-side" aria-label="Open the menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="model" id="model"></div>
      <div class="top-right" id="topRight"></div>
    </header>

    <section class="view" id="view-assistant">
      <div class="thread" id="thread"><div class="col" id="threadCol"></div></div>
      <div class="composer-wrap">
        <div class="col">
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Ask a question about your case" aria-label="Message"></textarea>
            <button class="send" id="send" type="submit" aria-label="Send" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </form>
          <div class="fine" id="fine"></div>
        </div>
      </div>
    </section>

    <section class="view page" id="view-agenda" hidden><div class="col" id="agendaCol"></div></section>
    <section class="view page" id="view-tracabilite" hidden><div class="col" id="ledgerCol"></div></section>
  </main>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head"><span id="drawerTitle">Source</span><button class="icon-btn" data-act="close-drawer" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
